<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Streak Runner</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-color: #0d0e12;
      --card-bg: #1a1c23;
      --accent: #ff4500;
      --text: #ffffff;
      --text-dim: #8e8e93;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom) 20px;
      background-color: var(--bg-color); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;
    }
    header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0 10px; }
    h1 { font-size: 1.5rem; margin: 0; font-weight: 800; }
    .btn-icon { background: none; border: none; color: var(--text-dim); font-size: 1.3rem; padding: 5px; cursor: pointer; }
    .streak-container { text-align: center; margin: 20px 0; }
    .streak-number {
      font-size: 5rem; font-weight: 900; line-height: 1;
      background: linear-gradient(180deg, #fff, #888);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .streak-active .streak-number {
      background: linear-gradient(180deg, #ff7b00, #ff4500);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .streak-label { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-dim); margin-top: 5px; }
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 25px; }
    .stat-card {
      background: var(--card-bg); padding: 16px; border-radius: 16px; text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .stat-value { font-size: 1.6rem; font-weight: 700; margin-bottom: 2px; }
    .stat-title { font-size: 0.75rem; color: var(--text-dim); text-transform: uppercase; }
    .input-section { background: var(--card-bg); padding: 20px; border-radius: 20px; margin-bottom: 25px; }
    .input-group { display: flex; gap: 10px; margin-top: 10px; }
    input[type="number"] {
      flex: 1; background: #000; border: 1px solid #333; color: #fff;
      padding: 14px 16px; border-radius: 12px; font-size: 1.1rem; outline: none;
    }
    .btn-submit {
      background: var(--accent); color: white; border: net; padding: 0 24px;
      border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; border: none;
    }
    .history-list { list-style: none; padding: 0; margin: 0; max-height: 200px; overflow-y: auto; }
    .history-item {
      display: flex; justify-content: space-between; padding: 12px 16px;
      background: var(--card-bg); border-radius: 12px; margin-bottom: 8px; font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div>
    <header>
      <h1>Streak Runner</h1>
      <button class="btn-icon" onclick="resetData()">🗑️</button>
    </header>

    <div class="streak-container" id="streak-box">
      <div class="streak-number" id="streak-count">0</div>
      <div class="streak-label">Tage Streak 🔥</div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value" id="total-km">0.0</div>
        <div class="stat-title">Gesamt km</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="total-runs">0</div>
        <div class="stat-title">Läufe</div>
      </div>
    </div>

    <div class="input-section">
      <label style="font-size: 0.85rem; color: var(--text-dim);">Heutigen Lauf eintragen</label>
      <div class="input-group">
        <input type="number" id="km-input" placeholder="z. B. 5.5" step="0.1" inputmode="decimal">
        <button class="btn-submit" onclick="addRun()">Speichern</button>
      </div>
    </div>

    <h3 style="font-size: 0.9rem; color: var(--text-dim); margin-bottom: 10px;">Verlauf</h3>
    <ul class="history-list" id="history-list"></ul>
  </div>

  <script>
    let runs = [];

    function loadData() {
      const saved = localStorage.getItem('running_streak_data_v2');
      if (saved) {
        try { runs = JSON.parse(saved); } catch(e) { runs = []; }
      }
      updateUI();
    }

    function saveData() {
      localStorage.setItem('running_streak_data_v2', JSON.stringify(runs));
    }

    function addRun() {
      const input = document.getElementById('km-input');
      const km = parseFloat(input.value);

      if (isNaN(km) || km <= 0) {
        alert("Bitte gib eine gültige Kilometerzahl ein.");
        return;
      }

      const today = new Date().toISOString().split('T')[0];
      const existingIndex = runs.findIndex(r => r.date === today);
      
      if (existingIndex >= 0) {
        runs[existingIndex].km = parseFloat((runs[existingIndex].km + km).toFixed(2));
      } else {
        runs.unshift({ date: today, km: parseFloat(km.toFixed(2)) });
      }

      input.value = '';
      saveData();
      updateUI();
    }

    function calculateStreak() {
      if (runs.length === 0) return 0;
      const sorted = [...runs].sort((a, b) => new Date(b.date) - new Date(a.date));
      
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      const lastRunDate = new Date(sorted[0].date);
      lastRunDate.setHours(0,0,0,0);

      const diffDays = Math.floor((today - lastRunDate) / (1000 * 60 * 60 * 24));
      if (diffDays > 1) return 0;

      let streak = 0;
      let checkDate = new Date(lastRunDate);

      for (let i = 0; i < sorted.length; i++) {
        const currentDate = new Date(sorted[i].date);
        currentDate.setHours(0,0,0,0);
        const dayDiff = Math.floor((checkDate - currentDate) / (1000 * 60 * 60 * 24));

        if (dayDiff === 0) {
          streak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else if (dayDiff > 1) {
          break;
        }
      }
      return streak;
    }

    function updateUI() {
      const totalKm = runs.reduce((sum, r) => sum + r.km, 0).toFixed(1);
      const streak = calculateStreak();

      document.getElementById('total-km').innerText = totalKm;
      document.getElementById('total-runs').innerText = runs.length;
      document.getElementById('streak-count').innerText = streak;

      const streakBox = document.getElementById('streak-box');
      if (streak > 0) {
        streakBox.classList.add('streak-active');
      } else {
        streakBox.classList.remove('streak-active');
      }

      const historyList = document.getElementById('history-list');
      historyList.innerHTML = '';
      runs.forEach(r => {
        const li = document.createElement('li');
        li.className = 'history-item';
        const dateFormatted = new Date(r.date).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: '2-digit' });
        li.innerHTML = `<span>${dateFormatted}</span><strong>${r.km} km</strong>`;
        historyList.appendChild(li);
      });
    }

    function resetData() {
      if (confirm("Möchtest du wirklich alle Läufe zurücksetzen?")) {
        runs = [];
        localStorage.removeItem('running_streak_data_v2');
        updateUI();
      }
    }

    loadData();
  </script>
</body>
</html>
